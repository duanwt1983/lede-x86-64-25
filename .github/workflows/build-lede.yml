name: Build Lean 25 x86-64 PassWall samba4

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.config'
      - 'diy-part1.sh'
      - 'diy-part2.sh'
      - 'files/**'
      - 'patches/**'
      - 'scripts/**'
      - '.github/workflows/build-lede.yml'

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -e
          echo "init start $(date -Is)"
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu*' -delete || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          timeout 60 sudo docker image prune --force || true
          echo "apt update $(date -Is)"
          timeout 8m sudo -E apt-get update -y
          echo "apt install $(date -Is)"
          timeout 15m sudo -E apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
            git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
            libssl-dev libtool lrzsz mkisofs ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools \
            python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs unzip vim \
            wget xmlto xxd zlib1g-dev
          sudo -E apt-get -y autoremove --purge || true
          sudo -E apt-get clean || true
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir
          SWAPIMG=/workdir/extra-swap
          if ! sudo swapon --show=NAME --noheadings 2>/dev/null | grep -qx "$SWAPIMG"; then
            sudo swapoff "$SWAPIMG" 2>/dev/null || true
            sudo rm -f "$SWAPIMG" || true
            sudo fallocate -l 8G "$SWAPIMG" || sudo dd if=/dev/zero of="$SWAPIMG" bs=1M count=8192
            sudo chmod 600 "$SWAPIMG"
            sudo mkswap "$SWAPIMG"
            sudo swapon "$SWAPIMG" || true
          fi
          echo "init done $(date -Is)"
          free -h
          df -hT

      - name: Clone source code
        working-directory: /workdir
        run: |
          df -hT $PWD
          git clone --depth=1 $REPO_URL -b $REPO_BRANCH openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
          echo "LEDE_SHA=$(git -C openwrt rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "GOLANG_SHA=$(git ls-remote https://github.com/sbwml/packages_lang_golang.git refs/heads/26.x | awk '{print substr($1,1,8)}')" >> $GITHUB_ENV

      - name: Restore download cache
        uses: actions/cache/restore@v4
        with:
          path: /workdir/openwrt/dl
          key: lede25-samba-dl-v1
          restore-keys: |
            lede25-samba-dl-v1-

      - name: Restore toolchain cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /workdir/openwrt/.ccache
            /workdir/openwrt/staging_dir/host
            /workdir/openwrt/staging_dir/hostpkg
            /workdir/openwrt/staging_dir/toolchain-x86_64_gcc-13.3.0_musl
            /workdir/openwrt/staging_dir/toolchain-x86_64_gcc-14.3.0_musl
            /workdir/openwrt/build_dir/host
            /workdir/openwrt/build_dir/hostpkg
            /workdir/openwrt/build_dir/toolchain-x86_64_gcc-13.3.0_musl
            /workdir/openwrt/build_dir/toolchain-x86_64_gcc-14.3.0_musl
          key: lede25-samba-tools-${{ env.LEDE_SHA }}-go-${{ env.GOLANG_SHA }}
          restore-keys: |
            lede25-samba-tools-${{ env.LEDE_SHA }}-go-${{ env.GOLANG_SHA }}
            lede25-samba-tools-${{ env.LEDE_SHA }}-go26-
            lede25-samba-tools-${{ env.LEDE_SHA }}-v1-
            lede25-samba-tools-${{ env.LEDE_SHA }}-

      - name: Load custom feeds
        run: |
          [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
          chmod +x $DIY_P1_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH

      - name: Update feeds
        run: cd openwrt && ./scripts/feeds update -a

      - name: Install feeds
        run: cd openwrt && ./scripts/feeds install -a

      - name: Load custom configuration
        run: |
          [ -e files ] && mv files openwrt/files
          [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
          chmod +x $DIY_P2_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P2_SH

      - name: Download package
        run: |
          cd openwrt
          make defconfig
          chmod +x $GITHUB_WORKSPACE/scripts/after-defconfig.sh $GITHUB_WORKSPACE/scripts/audit-config.sh
          $GITHUB_WORKSPACE/scripts/after-defconfig.sh
          $GITHUB_WORKSPACE/scripts/audit-config.sh
          grep -E 'CONFIG_PACKAGE_(luci-nginx|uhttpd|samba4|luci-app-samba4|luci-app-passwall|luci-app-mosdns|luci-app-istorex|luci-app-quickstart|luci-app-fastnet|luci-app-diskman|luci-i18n-diskman|luci-app-filemanager|luci-app-mwan3|mwan3|parted|blkid|kmod-ixgbe|smartmontools|mdadm|iptables|firewall4|nftables-json)|CONFIG_(VMDK_IMAGES|CCACHE)' .config || true
          rm -rf dl/go-mod-cache tmp/go-build
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile the firmware
        id: compile
        run: |
          cd openwrt
          rm -rf dl/go-mod-cache tmp/go-build
          echo -e "$(nproc) thread compile"
          echo "build host Go first (xray-core needs >= 1.25.6)"
          host_go_ok=0
          for t in package/feeds/packages/golang/host/compile package/feeds/packages/golang1.26/host/compile; do
            if make -j1 "$t"; then
              host_go_ok=1
              break
            fi
          done
          if [ "$host_go_ok" != 1 ]; then
            echo "host golang failed to compile"
            exit 1
          fi
          if [ -x staging_dir/hostpkg/bin/go ]; then
            staging_dir/hostpkg/bin/go version
          elif [ -x staging_dir/host/bin/go ]; then
            staging_dir/host/bin/go version
          fi
          dump_fail_logs() {
            echo "===== collected errors ====="
            grep -R "ERROR:\|Error 1\|requires go" logs 2>/dev/null | tail -n 120 || true
            echo "===== xray / go package logs ====="
            find logs -type f \( -path '*xray*' -o -path '*golang*' \) 2>/dev/null | while read -r f; do
              echo "---- $f ----"
              tail -n 80 "$f"
            done
            echo "===== failing package logs ====="
            find logs -type f -name '*.txt' 2>/dev/null | while read -r f; do
              if grep -Eq 'Error 1|fatal error|collected errors|requires go' "$f"; then
                echo "---- $f ----"
                tail -n 80 "$f"
              fi
            done
          }
          if ! make -j"$(nproc)"; then
            echo "parallel make failed, retry -j1"
            if ! make -j1; then
              dump_fail_logs
              exit 1
            fi
          fi
          echo "status=success" >> $GITHUB_OUTPUT
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      - name: Drop Go module cache before save
        if: always()
        run: rm -rf /workdir/openwrt/dl/go-mod-cache /workdir/openwrt/tmp/go-build

      - name: Save download cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /workdir/openwrt/dl
          key: lede25-samba-dl-v1-${{ github.run_id }}

      - name: Save toolchain cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            /workdir/openwrt/.ccache
            /workdir/openwrt/staging_dir/host
            /workdir/openwrt/staging_dir/hostpkg
            /workdir/openwrt/staging_dir/toolchain-x86_64_gcc-13.3.0_musl
            /workdir/openwrt/staging_dir/toolchain-x86_64_gcc-14.3.0_musl
            /workdir/openwrt/build_dir/host
            /workdir/openwrt/build_dir/hostpkg
            /workdir/openwrt/build_dir/toolchain-x86_64_gcc-13.3.0_musl
            /workdir/openwrt/build_dir/toolchain-x86_64_gcc-14.3.0_musl
          key: lede25-samba-tools-${{ env.LEDE_SHA }}-go-${{ env.GOLANG_SHA }}-${{ github.run_id }}

      - name: Organize files
        id: organize
        if: success() && env.UPLOAD_FIRMWARE == 'true'
        run: |
          cd openwrt
          dest=$(echo bin/targets/*/*)
          cd "$dest"
          mf=$(ls -1 *.manifest 2>/dev/null | head -1 || true)
          if [ -z "$mf" ]; then
            echo "missing image manifest"
            ls -la
            exit 1
          fi
          echo "==== image manifest (diskman / ixgbe / parted) ===="
          grep -E 'luci-app-diskman|luci-i18n-diskman|parted|blkid|kmod-ixgbe' "$mf" || true
          for need in luci-app-diskman parted kmod-ixgbe; do
            if ! grep -E "^${need}([[:space:]]|-)" "$mf"; then
              echo "IMAGE FAIL: ${need} not in $mf"
              cat "$mf"
              exit 1
            fi
          done
          rm -rf packages
          find . -type f ! -name '*ext4-combined-efi.img' ! -name '*ext4-combined-efi.img.gz' ! -name '*ext4-combined-efi.vmdk' ! -name '*ext4-combined-efi.vmdk.gz' ! -name 'sha256sums' -delete
          rev=$(sed -n "s/.*DISTRIB_REVISION='\([^']*\)'.*/\1/p" /workdir/openwrt/package/lean/default-settings/files/zzz-default-settings | head -1)
          [ -n "$rev" ] || rev=25
          day=$(date +%Y%m%d)
          img=$(ls -1 *ext4-combined-efi.img *ext4-combined-efi.img.gz 2>/dev/null | head -1 || true)
          vmdk=$(ls -1 *ext4-combined-efi.vmdk *ext4-combined-efi.vmdk.gz 2>/dev/null | head -1 || true)
          [ -n "$img" ] && mv -v "$img" "lede-${rev}-${day}.img${img##*.img}"
          [ -n "$vmdk" ] && mv -v "$vmdk" "lede-${rev}-${day}.vmdk${vmdk##*.vmdk}"
          if [ -f sha256sums ]; then
            mv -v sha256sums "sha256sums-lede-${rev}-${day}.txt"
          fi
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT
          ls -lh

      - name: Upload firmware directory
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: LEDE25_passwall_samba${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}
          retention-days: 14

      - name: Generate release tag
        id: tag
        if: success() && env.UPLOAD_RELEASE == 'true'
        run: |
          # New tag every run. Never reuse a tag and never delete old GitHub releases.
          echo "release_tag=$(date +"%Y.%m.%d-%H%M")-run${GITHUB_RUN_ID}" >> $GITHUB_OUTPUT
          {
            echo "## Lean LEDE 25 x86-64"
            echo
            echo "- Source: coolsnowwolf/lede master"
            echo "- Web: luci-nginx HTTPS (no uhttpd), Argon, default LuCI overview"
            echo "- LAN: 192.168.9.1/24, ext4 root 1024M, EFI img + VMDK"
            echo "- Proxy: PassWall nft + mosdns"
            echo "- WAN: mwan3 nftables port (no iptables)"
            echo "- Share: samba4; diskman + official filemanager; FastNet; ttyd; ddns-go"
            echo "- NIC: kmod-ixgbe (Intel 82599ES / X520 SFP+)"
            echo "- This release is additive; previous firmware releases are kept."
          } > release.txt
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware to release
        uses: softprops/action-gh-release@v2
        if: success() && steps.tag.outputs.status == 'success'
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: ${{ env.FIRMWARE }}/*
          fail_on_unmatched_files: true
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}
