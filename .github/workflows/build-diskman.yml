name: Build diskman package only

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  TZ: Asia/Shanghai

permissions:
  contents: write
  actions: write

jobs:
  diskman:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu*' -delete || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler flex gawk gettext gcc-multilib g++-multilib \
            git gperf help2man intltool libc6-dev-i386 libelf-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool \
            ninja-build patch pkgconf python3 python3-setuptools rsync swig unzip wget zlib1g-dev
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: Clone source code
        working-directory: /workdir
        run: |
          git clone --depth=1 $REPO_URL -b $REPO_BRANCH openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
          echo "LEDE_SHA=$(git -C openwrt rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Restore toolchain cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /workdir/openwrt/.ccache
            /workdir/openwrt/staging_dir/host
            /workdir/openwrt/staging_dir/hostpkg
            /workdir/openwrt/staging_dir/toolchain-x86_64_gcc-13.3.0_musl
            /workdir/openwrt/staging_dir/toolchain-x86_64_gcc-14.3.0_musl
            /workdir/openwrt/build_dir/host
            /workdir/openwrt/build_dir/hostpkg
          key: lede25-samba-tools-${{ env.LEDE_SHA }}-v1
          restore-keys: |
            lede25-samba-tools-${{ env.LEDE_SHA }}-

      - name: Restore download cache
        uses: actions/cache/restore@v4
        with:
          path: /workdir/openwrt/dl
          key: lede25-samba-dl-v1
          restore-keys: |
            lede25-samba-dl-v1-

      - name: Configure and compile diskman
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          chmod +x $GITHUB_WORKSPACE/scripts/prepare-diskman.sh
          $GITHUB_WORKSPACE/scripts/prepare-diskman.sh
          printf '%s\n' \
            'CONFIG_TARGET_x86=y' \
            'CONFIG_TARGET_x86_64=y' \
            'CONFIG_TARGET_x86_64_DEVICE_generic=y' \
            'CONFIG_PACKAGE_luci-compat=y' \
            'CONFIG_PACKAGE_luci-app-diskman=y' \
            'CONFIG_PACKAGE_luci-i18n-diskman-zh-cn=y' \
            'CONFIG_PACKAGE_parted=y' \
            'CONFIG_CCACHE=y' \
            '# CONFIG_PACKAGE_smartmontools is not set' \
            '# CONFIG_PACKAGE_mdadm is not set' \
            '# CONFIG_PACKAGE_luci-app-diskman_INCLUDE_mdadm is not set' \
            > .config
          make defconfig
          echo 'CONFIG_PACKAGE_luci-app-diskman=y' >> .config
          echo '# CONFIG_PACKAGE_smartmontools is not set' >> .config
          echo '# CONFIG_PACKAGE_mdadm is not set' >> .config
          if ! ls staging_dir/toolchain-x86_64_gcc-*/lib/ld-musl-*.so* >/dev/null 2>&1; then
            echo "Toolchain cache incomplete; building tools and toolchain only"
            make tools/install -j$(nproc) || make tools/install -j1 V=s
            make toolchain/install -j$(nproc) || make toolchain/install -j1 V=s
          fi
          make package/luci-app-diskman/compile -j$(nproc) || make package/luci-app-diskman/compile -j1 V=s
          mkdir -p /tmp/diskman-ipk
          find bin/packages -type f \( -name 'luci-app-diskman*.ipk' -o -name 'luci-i18n-diskman*.ipk' -o -name 'parted_*.ipk' \) -exec cp -v {} /tmp/diskman-ipk/ \;
          ls -lh /tmp/diskman-ipk
          test -n "$(ls /tmp/diskman-ipk/luci-app-diskman*.ipk 2>/dev/null)"

      - name: Upload diskman ipk
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-diskman-ipk
          path: /tmp/diskman-ipk/*
          retention-days: 14

      - name: Release diskman ipk
        uses: softprops/action-gh-release@v2
        with:
          tag_name: diskman-${{ github.run_id }}
          name: luci-app-diskman ${{ github.run_id }}
          body: |
            Standalone diskman packages for the current Lean 25 firmware.
            No SMART / mdadm.
            On the router:
            `opkg install luci-app-diskman_*.ipk luci-i18n-diskman-zh-cn_*.ipk`
          files: /tmp/diskman-ipk/*
          token: ${{ secrets.GITHUB_TOKEN }}
